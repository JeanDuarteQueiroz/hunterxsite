<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunter X Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="Favicon" href="assets/logotipo.ico" type="image/x-social-icon">
</head>
<body>

    <div class="painel">
        <div class="left-painel">
           
            <div class="logotipo-container">
                <a href="https://hunterxhunter.fandom.com/wiki/Hunterpedia" title="Logotipo de Hunter x Hunter" target="_blank" rel="noopener noreferrer">
                    <img src="assets/hunterxhunter/logotipo.png" alt="Logotipo do Site" class="logo">
                </a>
           </div>

            <div class="options">

                <button class="option-button">Quero me tornar um Caçador</button>
                <button class="option-button">Já sou Caçador</button>
                <a href="#" title="Saiba mais sobre o Hunter's Web Site" class="link-saiba-mais"> Saiba Mais... </a>

            </div>

             <div class="social-icons">

                <a href="https://github.com/jeanduartequeiroz" title="Logotipo do GitHub" target="_blank" rel="noopener noreferrer">
                    <img src="assets/Github/githubicon-w.svg" alt="Logotipo do GitHub" class="social-img">
                </a>

                <a href="https://www.linkedin.com/in/jean-duarte-queiroz/" title="Logotipo do LinkedIn" target="_blank" rel="noopener noreferrer">
                    <img src="assets/Linkedin/linkedinicon-w.svg" alt="Logotipo do LinkedIn" class="social-img">
                </a>

            </div>

        </div>
        <div class="right-painel">
             
            <img src="assets/bg-hunter-grande.png" alt="Imagem de Fundo com os Personagens" class="bg-image">

        </div>
    </div>



    <footer>
        
        <div class="text-container">
            <p class="footer-text">
                <strong>Projeto de Estudo</strong> | Feito por <b>Jean Duarte Queiroz</b>
                <br>
                Todos os direitos de conteúdo e marca pertencem aos proprietários originais
            </p>
        </div>

    </footer>
</body>
</html>
